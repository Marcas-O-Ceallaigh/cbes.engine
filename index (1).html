<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richlo Font Engine Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Temporary inline styles for testing your engine elements */
        body {
            font-family: 'Richlo', sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-size: 1.1rem;
            padding: 10px;
            margin-bottom: 20px;
        }
        .output-box {
            border: 1px solid #ccc;
            padding: 15px;
            min-height: 80px;
            font-size: 1.5rem;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <main>
        <h1>Richlo Typography Test</h1>
        <p class="regular">This is regular Richlo text.</p>
        <p class="iodalach">This is Richlo Iodalach text.</p>
        <p class="trom">This is Richlo Trom (heavy) text.</p>

        <!-- Engine Input & Output Elements -->
        <h2>Séimhiú Engine Test</h2>
        <label for="editor">Type here (e.g. bb, cc, ss):</label>
        <textarea id="editor" placeholder="Type double letters..."></textarea>

        <label>Live Output:</label>
        <div id="output" class="output-box"></div>
    </main>

    <!-- Clean external script link -->
    <script src="engine.js" defer></script>
</body>
</html>
