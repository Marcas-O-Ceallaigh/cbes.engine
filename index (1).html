<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richlo Font Engine Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Richlo Typography Test</h1>
        <p class="regular">This is regular Richlo text.</p>
        <p class="iodalach">This is Richlo Iodalach text.</p>
        <p class="trom">This is Richlo Trom (heavy) text.</p>
    </main>
</body>
    <script>
    // Your double-tap replacement map
    const replacements = {
        "bb": "ḃ", "cc": "ċ", "dd": "ḋ", "ff": "ḟ", "gg": "ġ",
        "mm": "ṁ", "pp": "ṗ", "ss": "ṡ", "tt": "ṫ", "ii": "ı",
        "aa": "ȧ", "ee": "ė", "oo": "ȯ", "uu": "u̇",
        "BB": "Ḃ", "CC": "Ċ", "DD": "Ḋ", "FF": "Ḟ", "GG": "Ġ",
        "MM": "Ṁ", "PP": "Ṗ", "SS": "Ṡ", "TT": "Ṫ"
    };

    // Point these to whatever your actual input and output HTML element IDs are!
    const editor = document.getElementById('editor'); // Your typing field
    const output = document.getElementById('output'); // Your display field

    editor.addEventListener('input', (e) => {
        let text = editor.value;

        // Automatically replace double letters on the fly
        for (const [key, val] of Object.entries(replacements)) {
            text = text.replaceAll(key, val);
        }

        output.textContent = text;
    });
        </script>
</html>
