<!DOCTYPE html>
<html lang="ga">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBÉS Engine Live Test</title>

  <style>
    @font-face {
      font-family: 'GlanchloTraditional';
      src: url('./glantgc.woff2') format('woff2');
    }

    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      font-size: 22px;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    .glanchlo-preview {
      font-family: 'GlanchloTraditional', serif;
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 15px;
      min-height: 100px;
      font-size: 28px;
      border-radius: 8px;
      margin-top: 15px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <h2>CBÉS Engine Live Tester</h2>

  <p>
    Type below using the CBÉS engine.
    Double letters such as <strong>gg</strong> and <strong>cc</strong>
    should convert automatically.
  </p>

  <textarea id="editor" placeholder="Scríobh anseo..."></textarea>

  <h3>Glanchló Output Preview</h3>

  <div id="preview" class="glanchlo-preview"></div>

  <script src="engine.js"></script>

</body>
</html>
